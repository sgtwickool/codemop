# Alembic configuration for the CLI (e.g. `alembic revision --autogenerate -m "..."`).
# The app runs migrations itself at startup (app.db.session.init_db), and both use
# DATABASE_URL from app settings, so no database URL is configured here.

[alembic]
script_location = %(here)s/src/app/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
