version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DATABASE_URL=postgresql://codemop:codemop@db:5432/codemop
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY}
      - API_KEY=${API_KEY}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - codemop_network

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codemop
      POSTGRES_PASSWORD: codemop
      POSTGRES_DB: codemop
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemop -d codemop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - codemop_network

  # Optional: Add Redis for caching (uncomment when needed)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   restart: unless-stopped
  #   networks:
  #     - codemop_network

volumes:
  postgres_data:

networks:
  codemop_network:
    driver: bridge