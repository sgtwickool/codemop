# The review eval's cases: a diff each (cases/<id>.diff) and the issues a good review finds.
#
#   major: clear-cut; "found the known issues" (recall) is measured on these
#   minor: real, but needs more context to spot; credited if found, not counted against if not
#
# tags: [kind, complexity, ...]. complexity is "simple" when the diff is small and the issue is
# visible within a few adjacent lines with no outside knowledge; "complex" when the diff is large,
# or spotting the issue means connecting distant parts of it or knowing something beyond the
# visible lines (framework behaviour, how GitHub numbers PRs, what a base image contains). Clean
# cases are tagged by size.
#
# Line numbers are new-file lines, as CodeMop shows them to the model. A suggestion is matched
# to an issue when it's in the same file, within 3 lines of a listed range, and the judge
# confirms it describes that issue. Any other suggestion is judged a real issue or a false alarm.
#
# Ground truth: the real-* issues are bugs found in CodeMop's own history and later fixed (the
# fixing commits are named); the seeded-* bugs were written in deliberately; the clean-* cases
# have no known issue. Human-written, not taken from any model's review (one exception, marked
# in real-suggestions-endpoint, was confirmed by hand before it was added).

# ---- real bugs from CodeMop's history ----

- id: real-pr-model
  tags: [real-bug, complex, python]
  source: "commit 237b670, backend/src/database.py (fixed in ca1830a)"
  issues:
    - severity: major
      description: >-
        github_id (the PR number) is unique across the whole table, but PR numbers restart at 1
        in every repository, so PRs from different repos collide and overwrite each other
      locations: [{file: backend/src/database.py, lines: [18, 18]}]

- id: real-webhook-endpoint
  tags: [real-bug, simple, python, security]
  source: "commit 237b670, backend/src/main.py (fixed in 3f98f76)"
  issues:
    - severity: major
      description: >-
        Webhook signature verification is skipped entirely when GITHUB_WEBHOOK_SECRET isn't
        set (fails open), so anyone can send forged events to a misconfigured server
      locations: [{file: backend/src/main.py, lines: [27, 27]}, {file: backend/src/main.py, lines: [42, 42]}]

- id: real-pr-storage
  tags: [real-bug, complex, python]
  source: "commit 6208175, backend/src/main.py and database.py (fixed in ca1830a and 24298d8)"
  issues:
    - severity: major
      description: >-
        PRs are looked up by PR number alone, with no repository, so a PR with the same number
        in another repo is found and updated instead
      locations: [{file: backend/src/database.py, lines: [73, 81]}, {file: backend/src/main.py, lines: [80, 80]}]
    - severity: minor
      description: >-
        The PR's status is set to the webhook action (e.g. "synchronize", "labeled") rather
        than its state (open, closed, merged)
      locations: [{file: backend/src/main.py, lines: [86, 86]}, {file: backend/src/database.py, lines: [64, 64]}]
    - severity: minor
      description: "The raw database exception text is returned to the client in the 500 response"
      locations: [{file: backend/src/main.py, lines: [93, 93]}]

- id: real-ai-analysis
  tags: [real-bug, complex, python]
  source: "commit 87a9f94, backend/src/main.py (fixed in 495398d and 576d45f)"
  issues:
    - severity: major
      description: >-
        The diff is silently cut at 10,000 characters before review, so most of a large PR is
        never reviewed and nobody is told
      locations: [{file: backend/src/main.py, lines: [184, 184]}]
    - severity: major
      description: >-
        "# Limit to first 10k characters" is inside the f-string, so it's sent to the model as
        part of the prompt rather than being a code comment
      locations: [{file: backend/src/main.py, lines: [184, 184]}]
    - severity: minor
      description: >-
        A 120-second timeout (with retries) on an AI call made inside the webhook request:
        GitHub gives up on a webhook after 10 seconds
      locations: [{file: backend/src/main.py, lines: [202, 205]}]

- id: real-suggestions-endpoint
  tags: [real-bug, complex, python]
  source: "commit 467452c, backend/src/main.py (fixed in a448d6a)"
  issues:
    - severity: major
      description: >-
        The 404 for a missing PR is raised inside the try block, so the broad
        `except Exception` catches it and returns a 500 instead
      locations: [{file: backend/src/main.py, lines: [378, 383]}, {file: backend/src/main.py, lines: [420, 425]}]
    # Upgraded from minor after the eval's pilot, when Opus 5.5 pointed out the bypass: verified
    # against uvicorn, which returned 200 for "Bearer \xa0" and "Bearer \x85"
    - severity: major
      description: >-
        With API_KEY unset (it defaults to an empty string), authentication can be bypassed: a
        header of "Bearer " plus a character Python's strip() removes but HTTP servers don't (a
        non-breaking space, 0xA0) strips to "" and matches the empty key. Also compared with !=,
        not in constant time
      locations: [{file: backend/src/main.py, lines: [36, 41]}, {file: backend/src/main.py, lines: [74, 74]}]

- id: real-refactor-webhooks
  tags: [real-bug, complex, python]
  source: "commit 94162a3, webhooks.py and security.py (fixed in a448d6a)"
  issues:
    - severity: major
      description: >-
        `pr_data` isn't defined in this function (it's pr_db_data / pr_metadata), so logging
        after storing suggestions, and in its error handler, raises NameError
      locations: [{file: backend/src/app/api/v1/endpoints/webhooks.py, lines: [69, 71]}]
    - severity: minor
      description: "The webhook signature is only checked for pull_request events, not every event"
      locations: [{file: backend/src/app/api/v1/endpoints/webhooks.py, lines: [21, 23]}]

- id: real-security-config
  tags: [real-bug, complex, python, security]
  source: "commit df43463, security_config.py and main.py (fixed in 10683fd, a448d6a and 390dc03)"
  issues:
    - severity: major
      description: >-
        CORS allows any origin together with credentials, which lets any website make
        credentialed requests to the API
      locations: [{file: backend/src/app/core/security_config.py, lines: [26, 27]}]
    - severity: minor
      description: >-
        Content-Security-Policy default-src 'self' blocks the CDN scripts and styles FastAPI's
        Swagger/ReDoc pages load, so the API docs render blank
      locations: [{file: backend/src/app/core/security_config.py, lines: [21, 21]}]
    - severity: minor
      description: >-
        A per-IP limit of 10 webhooks a minute: GitHub's deliveries come from a few shared IPs,
        so bursts get 429s, and GitHub doesn't retry those
      locations: [{file: backend/src/app/core/security_config.py, lines: [7, 7]}]

- id: real-prod-dockerfile
  tags: [real-bug, complex, docker]
  source: "commit a3f6dcd, backend/Dockerfile.prod (fixed in a448d6a)"
  issues:
    - severity: major
      description: "The HEALTHCHECK uses curl, which python:slim images don't include, so the container never reports healthy"
      locations: [{file: backend/Dockerfile.prod, lines: [48, 49]}]
    - severity: minor
      description: >-
        The runtime stage reinstalls every requirement from scratch, so the builder stage's
        install is wasted (the multi-stage build saves nothing)
      locations: [{file: backend/Dockerfile.prod, lines: [19, 19]}, {file: backend/Dockerfile.prod, lines: [42, 42]}]

- id: real-monitoring
  tags: [real-bug, complex, python]
  source: "commit fdb2b90, monitoring middleware and setup (fixed in 5435754)"
  issues:
    - severity: major
      description: >-
        The middleware imports REQUEST_COUNT and the other metrics by value at import time,
        while they're still None (setup_metrics() assigns the module globals later), so no
        metrics are ever recorded
      locations:
        - {file: backend/src/app/core/middleware/monitoring_middleware.py, lines: [11, 11]}
        - {file: backend/src/app/core/middleware/monitoring_middleware.py, lines: [74, 74]}
        - {file: backend/src/app/core/monitoring.py, lines: [241, 244]}
    - severity: minor
      description: "A metrics HTTP server is started on a fixed port by default, at import time"
      locations: [{file: backend/src/app/core/monitoring.py, lines: [188, 190]}]

# ---- seeded bugs: one each ----

- id: seeded-pagination
  tags: [seeded-bug, simple, python]
  issues:
    - severity: major
      description: "Pages are numbered from 1, but start = page * page_size, so page 1 skips the first page of results"
      locations: [{file: api/listing.py, lines: [3, 4]}]

- id: seeded-sql-injection
  tags: [seeded-bug, simple, python, security]
  issues:
    - severity: major
      description: "name_fragment is interpolated into the SQL with an f-string: SQL injection"
      locations: [{file: store/users.py, lines: [10, 12]}]

- id: seeded-missing-await
  tags: [seeded-bug, simple, python]
  issues:
    - severity: major
      description: "cache.set is async (cache.get is awaited) but isn't awaited, so the profile is never cached"
      locations: [{file: services/profile.py, lines: [6, 6]}]

- id: seeded-mutable-default
  tags: [seeded-bug, simple, python]
  issues:
    - severity: major
      description: "A mutable default argument: the same list is shared across calls and grows each time"
      locations: [{file: notify/email.py, lines: [1, 3]}]

- id: seeded-async-foreach
  tags: [seeded-bug, simple, typescript]
  issues:
    - severity: major
      description: "forEach doesn't await async callbacks, so syncAll returns 0 before any account is synced"
      locations: [{file: src/sync.ts, lines: [3, 7]}]

- id: seeded-go-defer-before-err
  tags: [seeded-bug, simple, go]
  issues:
    - severity: major
      description: "resp.Body.Close() is deferred before err is checked; when the request fails resp is nil and it panics"
      locations: [{file: client/fetch.go, lines: [6, 9]}]

- id: seeded-inverted-expiry
  tags: [seeded-bug, simple, python, security]
  issues:
    - severity: major
      description: "The comparison is inverted: tokens are rejected while still valid, and accepted after they expire"
      locations: [{file: auth/tokens.py, lines: [11, 12]}]

- id: seeded-assignment-in-condition
  tags: [seeded-bug, simple, typescript, security]
  issues:
    - severity: major
      description: "user.role = \"admin\" assigns rather than compares, so the check always passes and anyone can delete any project"
      locations: [{file: src/admin.ts, lines: [5, 5]}]

- id: seeded-regex-prefix-validation
  tags: [seeded-bug, simple, python, security]
  issues:
    - severity: major
      description: >-
        re.match only checks the start of the name (no end anchor), so a name like "db; rm -rf /"
        passes validation, and the command runs through a shell: command injection
      locations: [{file: ops/backup.py, lines: [7, 9]}]

