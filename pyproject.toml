[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codemop"
dynamic = ["version"]  # from src/codemop/__init__.py
description = "AI code review for pull requests, with the model of your choice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Gregory Kemp" }]
keywords = ["code review", "pull requests", "github", "ai", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# A library: version ranges, not exact pins (the server in server/ pins exactly)
dependencies = [
    "anthropic>=1.11,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/sgtwickool/codemop"

[project.scripts]
codemop = "codemop.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
]

[tool.hatch.version]
path = "src/codemop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codemop"]

# The source release is the package and its tests, not the server, evals or docs
[tool.hatch.build.targets.sdist]
include = ["/src/codemop", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# importlib: test dirs aren't packages, so they can't clash with server/tests
addopts = ["--strict-markers", "--import-mode=importlib"]
