name: Release

# Publishes the codemop package to PyPI when a version tag (v0.1.0, ...) is pushed; not the
# Action's major tag (v1), which moves to each release. PyPI trusts this workflow directly
# (trusted publishing), so no API token is stored anywhere.
on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install the package
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group dev

    - name: Check the tag matches the package version
      run: |
        version=$(python -c "import codemop; print(codemop.__version__)")
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in src/codemop/__init__.py"
          exit 1
        fi

    - name: Run the package tests
      run: pytest --no-cov -q

    - name: Build the wheel and source release
      run: |
        pip install build twine
        python -m build
        twine check --strict dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Matches the trusted publisher on PyPI; the environment can require an approval
    environment:
      name: pypi
      url: https://pypi.org/project/codemop/
    permissions:
      id-token: write  # to prove to PyPI which workflow this is
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
