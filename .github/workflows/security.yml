name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: pip install -e . -r server/requirements-dev.txt

    # Fails the job if any pinned runtime dependency has a known vulnerability
    - name: pip-audit (dependency vulnerability scanning)
      run: pip-audit -r server/requirements.txt

    - name: Bandit (security linting)
      run: bandit -c server/.bandit -r server/src/ src/

    - name: Build Docker image for scanning
      run: docker build -f server/Dockerfile.prod -t codemop-scan:latest .

    - name: Trivy (container scanning)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'codemop-scan:latest'
        format: 'table'
        exit-code: '0'  # Don't fail on vulnerabilities for now
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'