name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: pip install -r backend/requirements-dev.txt

    # Fails the job if any pinned runtime dependency has a known vulnerability
    - name: pip-audit (dependency vulnerability scanning)
      run: pip-audit -r backend/requirements.txt

    - name: Bandit (security linting)
      run: bandit -c backend/.bandit -r backend/src/

    - name: Build Docker image for scanning
      run: docker build -f backend/Dockerfile.prod -t codemop-scan:latest backend/

    - name: Trivy (container scanning)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'codemop-scan:latest'
        format: 'table'
        exit-code: '0'  # Don't fail on vulnerabilities for now
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'