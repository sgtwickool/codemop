name: CodeMop

# CodeMop reviewing its own pull requests, and committing the fixes ticked in its summary,
# with the action as it is on master. Also reviews by hand (Actions → CodeMop → Run
# workflow) for any PR number.
on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review ]
  issue_comment:
    types: [ edited ]
  pull_request_review_comment:
    types: [ created ]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write  # to commit ticked fixes
  pull-requests: write

# Reviews: a new push replaces one still running. Commits (ticked fixes, learned notes) queue
concurrency:
  group: codemop-${{ (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && 'review' || 'changes' }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' }}

jobs:
  review:
    # Dependabot's runs don't get Actions secrets, so they'd have no key; on comments, only
    # edits of CodeMop's summary and `/codemop learn` replies
    if: >-
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'codemop-summary')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/codemop learn') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
    # Never check out the PR here: this job holds the API key (see the README)
    - uses: sgtwickool/codemop@master
      with:
        api-key: ${{ secrets.ANTHROPIC_API_KEY }}
        pull-request: ${{ inputs.pr && format('{0}#{1}', github.repository, inputs.pr) || '' }}
