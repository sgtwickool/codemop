name: Continuous Integration

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # The codemop package (src/codemop): review core, providers, CLI
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install the package and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . --group dev

    - name: Run package tests
      run: pytest --cov=codemop --cov-report=term

  # The webhook server (server/)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r server/requirements-dev.txt

    # The tests configure their own SQLite database and settings (see tests/conftest.py)
    - name: Run tests with coverage
      working-directory: server
      run: pytest

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v7
      with:
        files: server/coverage.xml
        flags: unittests
        fail_ci_if_error: false

  # SQLite (above) ignores column lengths and integer ranges, and runs migrations in
  # batch mode, so the suite also runs against the database production uses
  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codemop
          POSTGRES_PASSWORD: codemop
          POSTGRES_DB: codemop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codemop -d codemop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: server/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -r server/requirements-dev.txt

    - name: Run tests against PostgreSQL
      working-directory: server
      env:
        TEST_DATABASE_URL: postgresql://codemop:codemop@localhost:5432/codemop_test
      run: pytest --no-cov
