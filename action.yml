name: CodeMop review
description: AI code review for pull requests, with the model of your choice. Tick the fixes you want and it commits them.
author: Gregory Kemp
branding:
  icon: check-circle
  color: blue

inputs:
  api-key:
    description: The model provider's API key. Store it as a repository secret. (Not used when committing ticked fixes.)
    required: true
  provider:
    description: anthropic, mistral, openai, openrouter, ollama or openai-compatible
    default: anthropic
  model:
    description: The model (default for anthropic, claude-opus-5-5; mistral, codestral-latest)
    default: ""
  base-url:
    description: API base URL, for openai-compatible or a self-hosted endpoint
    default: ""
  effort:
    description: Claude's effort level (low, medium, high, xhigh, max); lower is cheaper and faster
    default: ""
  max-changed-lines:
    description: Don't review a PR with more added and removed lines than this (a cost limit)
    default: "3000"
  max-comments:
    description: Most inline comments in a review; the rest go in its summary (default, the repository's .codemop.yml or 10)
    default: ""
  checklist:
    description: A checkbox in the summary for each fix; ticking them commits them (needs the issue_comment trigger and contents write, see the README)
    default: "true"
  review-drafts:
    description: Review draft pull requests too
    default: "false"
  pull-request:
    description: The pull request to review, as owner/repo#123 (default, the one that triggered the workflow)
    default: ""
  github-token:
    description: Token for reading the PR, posting the review and committing fixes; needs pull-requests write (and contents write for fixes). GitHub doesn't run other workflows for commits made with the default token (their checks show as failed to start), so CI doesn't run on fix commits; a personal access token here fixes that
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install CodeMop
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/codemop"
        "$RUNNER_TEMP/codemop/bin/pip" install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    # Inputs reach the script as environment variables, never spliced into it
    - name: Review the pull request
      shell: bash
      env:
        CODEMOP_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PROVIDER: ${{ inputs.provider }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base-url }}
        EFFORT: ${{ inputs.effort }}
        MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        MAX_COMMENTS: ${{ inputs.max-comments }}
        REVIEW_DRAFTS: ${{ inputs.review-drafts }}
        CHECKLIST: ${{ inputs.checklist }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        EVENT_ISSUE_IS_PR: ${{ github.event.issue.pull_request && 'true' || '' }}
        EVENT_EDITED_SUMMARY: ${{ contains(github.event.comment.body, '<!-- codemop-summary -->') }}
        EVENT_SENDER: ${{ github.event.sender.login }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_PR_DRAFT: ${{ github.event.pull_request.draft }}
        REPOSITORY: ${{ github.repository }}
        GITHUB_API: ${{ github.api_url }}
      run: |
        codemop="$RUNNER_TEMP/codemop/bin/codemop"

        # Someone ticked fixes in CodeMop's summary: commit them (if they have write access)
        if [ "$EVENT_NAME" = "issue_comment" ]; then
          if [ -z "$EVENT_ISSUE_IS_PR" ] || [ "$EVENT_EDITED_SUMMARY" != "true" ]; then
            echo "Not CodeMop's summary on a pull request; nothing to do"
            exit 0
          fi
          exec "$codemop" apply "$REPOSITORY#$EVENT_ISSUE_NUMBER" --by "$EVENT_SENDER" --github-api-url "$GITHUB_API"
        fi

        target="$PULL_REQUEST"
        if [ -z "$target" ]; then
          if [ -z "$EVENT_PR_NUMBER" ]; then
            echo "::error::No pull request to review: run on pull_request or pull_request_target events, or set pull-request"
            exit 1
          fi
          target="$REPOSITORY#$EVENT_PR_NUMBER"
          if [ "$EVENT_PR_DRAFT" = "true" ] && [ "$REVIEW_DRAFTS" != "true" ]; then
            echo "Skipping $target: it's a draft (set review-drafts: true to review drafts)"
            exit 0
          fi
        fi

        args=(review "$target" --post --provider "$PROVIDER" --api-key-env CODEMOP_API_KEY --github-api-url "$GITHUB_API")
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
        [ -n "$EFFORT" ] && args+=(--effort "$EFFORT")
        [ -n "$MAX_CHANGED_LINES" ] && args+=(--max-changed-lines "$MAX_CHANGED_LINES")
        [ -n "$MAX_COMMENTS" ] && args+=(--max-comments "$MAX_COMMENTS")
        [ "$CHECKLIST" = "true" ] && args+=(--checklist)
        "$codemop" "${args[@]}"
